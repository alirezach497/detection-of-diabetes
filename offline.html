<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>آفلاین — تشخیص دیابت</title>
  <link rel="stylesheet" href="fonts/font awesome/all.min.css" />
  <link rel="stylesheet" href="fonts/vazir/vazir.css" />
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #0b0f1a, #1a1f2f);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .box {
      background: rgba(20, 25, 40, 0.7);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 32px;
      padding: 3rem 2rem;
      max-width: 400px;
    }
    h1 { color: #00d4ff; margin-bottom: 1rem; }
    p { color: #a0b4d0; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📡 آفلاین هستید</h1>
    <p>اتصال اینترنت شما قطع است. لطفاً پس از برقراری اتصال، صفحه را دوباره بارگذاری کنید.</p>
  </div>
</body>
</html>
